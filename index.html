<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>成都工务段 - 铁路沿线安全环境隐患排查整治大会战工作日报生成器</title>
<script src="docx.umd.js"></script>
<script src="html2canvas.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
:root {
  --primary: #1a5276;
  --primary-light: #2980b9;
  --bg: #f0f3f6;
  --card-bg: #ffffff;
  --text: #2c3e50;
  --text-light: #5d6d7e;
  --border: #d5dbdb;
  --accent: #c0392b;
  --success: #27ae60;
  --warning: #f39c12;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --input-bg: #f8f9fa;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
input, textarea, select {
  -webkit-user-select: text;
  user-select: text;
}
@media (max-width: 600px) {
  input, textarea, select, button { font-size: 16px !important; }
  .btn-sm, .btn-sm input { font-size: 13px !important; }
}
.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 16px;
}
.header {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  padding: 24px 20px;
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  border-radius: var(--radius);
  margin-bottom: 16px;
  text-align: center;
  box-shadow: var(--shadow);
}
.header .title-input {
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 4px;
  width: 100%;
  border: none;
  background: rgba(255,255,255,0.15);
  color: #fff;
  text-align: center;
  padding: 8px 12px;
  border-radius: 6px;
  font-family: inherit;
  outline: none;
  transition: background 0.2s;
}
.header .title-input:focus { background: rgba(255,255,255,0.25); }
.header .title-input::placeholder { color: rgba(255,255,255,0.5); }
.header .subtitle {
  font-size: 13px;
  opacity: 0.85;
  letter-spacing: 0.5px;
}
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--primary-light);
}
.card-header .section-num {
  background: var(--primary);
  color: #fff;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.card-header .section-title-input {
  font-size: 16px;
  color: var(--primary);
  font-weight: 700;
  border: 1px solid transparent;
  background: transparent;
  padding: 4px 8px;
  border-radius: 4px;
  font-family: inherit;
  outline: none;
  flex: 1;
  transition: border-color 0.2s, background 0.2s;
}
.card-header .section-title-input:focus {
  border-color: var(--primary-light);
  background: #f0f4ff;
}
.date-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.date-row label {
  font-weight: 600;
  white-space: nowrap;
  color: var(--text-light);
  font-size: 14px;
}
.date-row input[type="date"] {
  flex: 1;
  min-width: 160px;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  background: var(--input-bg);
  transition: border-color 0.2s;
}
.date-row input[type="date"]:focus {
  border-color: var(--primary-light);
  outline: none;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.form-group label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  white-space: nowrap;
}
.form-group label .unit {
  font-weight: 400;
  color: #999;
  font-size: 11px;
}
.form-group input, .form-group textarea {
  padding: 10px 12px;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--input-bg);
  transition: border-color 0.2s;
  font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus {
  border-color: var(--primary-light);
  outline: none;
}
.form-group textarea {
  resize: vertical;
  min-height: 80px;
}
.form-group input[type="number"] { -moz-appearance: textfield; }
.form-group input[type="number"]::-webkit-outer-spin-button,
.form-group input[type="number"]::-webkit-inner-spin-button { opacity: 1; }
/* Subsection */
.subsection {
  background: #f8f9fa;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
}
.subsection-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 8px;
}
.subsection-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
}
/* Item card */
.item-card {
  background: #fafbfc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 12px;
  position: relative;
}
.item-card .item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.item-card .item-num {
  font-weight: 700;
  color: var(--primary);
  font-size: 14px;
}
.item-card .item-content {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.item-card textarea { min-height: 100px; }
/* Image upload */
.image-upload-area {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--input-bg);
}
.image-upload-area:hover {
  border-color: var(--primary-light);
  background: #eef5fb;
}
.image-upload-area .upload-icon { font-size: 28px; margin-bottom: 4px; }
.image-upload-area .upload-text { font-size: 13px; color: var(--text-light); }
.image-preview-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.image-preview-item {
  position: relative;
  width: 100px;
  height: 100px;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.image-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.image-preview-item .remove-btn {
  position: absolute;
  top: 0;
  right: 0;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 0 6px 0 6px;
  width: 28px;
  height: 28px;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  touch-action: manipulation;
}
.empty-hint {
  text-align: center;
  padding: 20px;
  color: #999;
  font-size: 14px;
}
/* Buttons */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover {
  background: var(--primary-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(26,82,118,0.3);
}
.btn-outline {
  background: #fff;
  color: var(--primary);
  border: 2px solid var(--primary);
}
.btn-outline:hover { background: #eef5fb; }
.btn-danger {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-danger:hover { background: #fdedec; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-block {
  width: 100%;
  justify-content: center;
  padding: 14px;
  font-size: 16px;
}
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.generate-section {
  text-align: center;
  padding: 10px 0;
}
.generate-section .btn-primary {
  font-size: 17px;
  padding: 16px 48px;
  letter-spacing: 1px;
}
.status-msg {
  margin-top: 12px;
  font-size: 14px;
  color: var(--text-light);
  min-height: 20px;
}
.status-msg.success { color: var(--success); font-weight: 600; }
.status-msg.error { color: var(--accent); }
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff;
  border-radius: var(--radius);
  padding: 24px;
  max-width: 700px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal h3 {
  margin-bottom: 16px;
  color: var(--primary);
}
/* Responsive */
@media (max-width: 600px) {
  .container { padding: 8px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
  .card { padding: 12px; border-radius: 8px; margin-bottom: 10px; }
  .card-header { flex-wrap: wrap; gap: 6px; }
  .card-header .section-num { width: 26px; height: 26px; font-size: 12px; }
  .card-header .section-title-input { font-size: 14px; }
  .form-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .form-group label { font-size: 11px; }
  .form-group input, .form-group textarea { font-size: 16px; padding: 10px; }
  .header { padding: 14px 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); border-radius: 8px; }
  .header .title-input { font-size: 15px; }
  .header .subtitle { font-size: 11px; }
  .generate-section .btn-primary { width: 100%; max-width: 400px; padding: 14px 28px; font-size: 15px; }
  .generate-section .btn { max-width: 100% !important; }
  .toggle-btn { padding: 8px 12px; font-size: 13px; min-height: 40px; }
  .btn { font-size: 13px; padding: 10px 14px; min-height: 40px; }
  .item-card { padding: 10px; }
  .item-card .item-header { flex-wrap: wrap; gap: 8px; }
  .image-preview-item { width: 72px; height: 72px; }
  .image-preview-item .remove-btn { width: 30px; height: 30px; font-size: 15px; }
  .btn-row { flex-direction: column; }
  .btn-row .btn { width: 100%; max-width: 100% !important; justify-content: center; }
  .subsection { padding: 10px; }
  .subsection-header { flex-direction: column; align-items: stretch; }
}
@media (max-width: 430px) {
  .header { padding: 12px 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  .header .title-input { font-size: 14px; padding: 10px 8px; }
  .header .subtitle { font-size: 10px; }
  .card-header { flex-wrap: wrap; gap: 4px; }
  .card-header .section-title-input { font-size: 13px; min-width: 0; flex: 1 1 100%; }
  .toggle-switch { margin-left: 0; }
  .generate-section .btn-primary { font-size: 16px; padding: 16px 20px; min-height: 48px; }
  .generate-section .btn-outline { font-size: 16px; padding: 16px 20px; min-height: 48px; }
  .btn { min-height: 44px; }
  .btn-sm { min-height: 40px; padding: 8px 12px; font-size: 13px; }
  .date-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .date-row label { font-size: 13px; }
  .date-row input[type="date"] { min-width: 0; width: 100%; }
  .image-upload-area { padding: 20px 12px; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .image-upload-area .upload-icon { font-size: 32px; }
  .image-upload-area .upload-text { font-size: 14px; }
  .modal { max-width: 100%; max-height: 90vh; max-height: 90dvh; border-radius: 12px 12px 0 0; margin-top: auto; -webkit-overflow-scrolling: touch; }
  .modal-overlay { align-items: flex-end; padding-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .item-card .item-header { flex-direction: column; align-items: stretch; }
  .item-card .item-header .btn { width: 100%; justify-content: center; }
  .toggle-btn { min-height: 40px; padding: 8px 10px; }
  .form-grid { gap: 6px; }
}
@media (max-width: 380px) {
  .container { padding: 6px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
  .card { padding: 10px; margin-bottom: 8px; }
  .form-grid { grid-template-columns: 1fr; }
  .card-header { flex-direction: column; align-items: stretch; }
  .card-header .section-num { align-self: flex-start; }
  .toggle-switch { width: 100%; }
  .toggle-btn { flex: 1; text-align: center; }
  .header .title-input { font-size: 13px; }
  .generate-section .btn-primary { padding: 16px 12px; font-size: 15px; }
}
@supports (padding: env(safe-area-inset-bottom)) {
  .container { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  .modal-overlay { padding-bottom: env(safe-area-inset-bottom); }
}
body {
  -webkit-overflow-scrolling: touch;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}
.modal {
  -webkit-overflow-scrolling: touch;
}
.help-text {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toggle-switch {
  display: flex;
  border: 2px solid var(--primary);
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
}
.toggle-btn {
  padding: 6px 14px;
  background: #fff;
  color: var(--primary);
  border: none;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  white-space: nowrap;
}
.toggle-btn.active { background: var(--primary); color: #fff; }
.toggle-btn:not(.active):hover { background: #eef5fb; }
@media (max-width: 600px) {
  .toggle-btn { padding: 6px 10px; font-size: 12px; }
}
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <input type="text" id="mainTitle" class="title-input" value="成都工务段铁路沿线安全环境隐患排查整治大会战工作日报">
    <div class="subtitle">成都工务段 · 日报生成系统</div>
  </div>

  <!-- Date -->
  <div class="card">
    <div class="date-row">
      <label for="reportDate">日报日期：</label>
      <input type="date" id="reportDate">
    </div>
  </div>

  <!-- Section 1: 当日工作开展情况 -->
  <div class="card" id="section1">
    <div class="card-header">
      <div class="section-num">1</div>
      <input type="text" id="section1Title" class="section-title-input" value="一、当日工作开展情况">
      <div class="toggle-switch" style="margin-left:auto">
        <button class="toggle-btn active" id="s1ToggleData" onclick="switchS1Mode('data')">填写数据</button>
        <button class="toggle-btn" id="s1ToggleFree" onclick="switchS1Mode('free')">直接粘贴总结</button>
      </div>
    </div>
    <!-- 填写数据模式 -->
    <div id="s1DataMode">
    <div class="form-grid">
      <div class="form-group">
        <label>出动排查人员 <span class="unit">(人次)</span></label>
        <input type="number" id="s1_personnel" placeholder="如: 10" min="0">
      </div>
      <div class="form-group">
        <label>车间干部 <span class="unit">(人次)</span></label>
        <input type="number" id="s1_ganbu" placeholder="如: 0" min="0" value="0">
      </div>
      <div class="form-group">
        <label>包保组成员 <span class="unit">(人次)</span></label>
        <input type="number" id="s1_baobao" placeholder="如: 0" min="0" value="0">
      </div>
      <div class="form-group">
        <label>对接协调区县 <span class="unit">(个)</span></label>
        <input type="number" id="s1_district" placeholder="如: 2" min="0" value="0">
      </div>
      <div class="form-group">
        <label>乡镇（街道） <span class="unit">(个)</span></label>
        <input type="number" id="s1_town" placeholder="如: 3" min="0" value="0">
      </div>
      <div class="form-group">
        <label>村社 <span class="unit">(个)</span></label>
        <input type="number" id="s1_village" placeholder="如: 5" min="0" value="0">
      </div>
      <div class="form-group">
        <label>当日隐患销号 <span class="unit">(处)</span></label>
        <input type="number" id="s1_cancel" placeholder="如: 0" min="0" value="0">
      </div>
      <div class="form-group">
        <label>未销号隐患 <span class="unit">(处)</span></label>
        <input type="number" id="s1_unresolved" placeholder="如: 288" min="0" value="0">
      </div>
      <div class="form-group">
        <label>立查立改隐患 <span class="unit">(处)</span></label>
        <input type="number" id="s1_immediate" placeholder="如: 0" min="0" value="0">
      </div>
      <div class="form-group">
        <label>下发隐患告知书 <span class="unit">(份)</span></label>
        <input type="number" id="s1_notice" placeholder="如: 0" min="0" value="0">
      </div>
      <div class="form-group">
        <label>违法行为通知书 <span class="unit">(份)</span></label>
        <input type="number" id="s1_violation" placeholder="如: 0" min="0" value="0">
      </div>
    </div>
    <div style="margin-top:12px">
      <div class="form-group">
        <label>其他备注（选填，将追加在段落末尾）</label>
        <input type="text" id="s1_extra_note" placeholder="如有额外说明请填写...">
      </div>
    </div>
    </div>
    <!-- 直接粘贴总结模式 -->
    <div id="s1FreeMode" style="display:none">
      <div class="form-group">
        <textarea id="s1_free_text" rows="8" placeholder="直接在此粘贴当日工作开展情况的完整总结文字...&#10;&#10;例如：8月10日，我段共出动排查人员10人次、车间干部0人次、包保组成员0人次；当日对接协调区县2个、乡镇（街道）3个、村社5个。当日隐患销号0处，未销号隐患288处；立查立改隐患0处，下发隐患告知书0份，违法行为通知书0份。"></textarea>
        <span class="help-text">粘贴后生成Word时会自动套用正文格式（华文仿宋，16pt，首行缩进2字符，两端对齐）</span>
      </div>
    </div>
  </div>

  <!-- Section 2: 隐患整治推进情况 -->
  <div class="card" id="section2">
    <div class="card-header">
      <div class="section-num">2</div>
      <input type="text" id="section2Title" class="section-title-input" value="二、隐患整治推进情况">
    </div>

    <!-- （一）隐患推送情况 -->
    <div class="subsection">
      <div class="subsection-header">
        <span class="subsection-title">（一）隐患推送情况</span>
        <button class="btn btn-outline btn-sm" onclick="addS2Item('a')">+ 添加条目</button>
      </div>
      <div id="s2aItems"></div>
      <div id="s2aEmpty" class="empty-hint">暂无条目，点击"+ 添加条目"开始填写</div>
    </div>

    <!-- （二）对接协调整治情况 -->
    <div class="subsection">
      <div class="subsection-header">
        <span class="subsection-title">（二）对接协调整治情况</span>
        <button class="btn btn-outline btn-sm" onclick="addS2Item('b')">+ 添加条目</button>
      </div>
      <div id="s2bItems"></div>
      <div id="s2bEmpty" class="empty-hint">暂无条目，点击"+ 添加条目"开始填写</div>
    </div>
  </div>

  <!-- Section 3: 需段协调解决问题 -->
  <div class="card" id="section3">
    <div class="card-header">
      <div class="section-num">3</div>
      <input type="text" id="section3Title" class="section-title-input" value="三、需段协调解决问题">
    </div>
    <div class="form-group">
      <textarea id="s3_content" rows="4" placeholder="填写需段协调解决的问题，如无则填写"无""></textarea>
    </div>
  </div>

  <!-- Generate -->
  <div class="card generate-section">
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="generateReport()" id="generateBtn" style="flex:1; max-width:300px">
        生成并下载 Word 日报
      </button>
      <button class="btn btn-outline" onclick="generatePDF()" id="generatePdfBtn" style="flex:1; max-width:300px">
        生成并下载 PDF 日报
      </button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="status-msg" id="pdfStatusMsg"></div>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <h3>生成预览</h3>
    <div id="previewContent" style="font-size:14px; line-height:2; white-space:pre-wrap;"></div>
    <div style="margin-top:16px; text-align:right">
      <button class="btn btn-outline" onclick="closePreview()">关闭</button>
      <button class="btn btn-primary" onclick="downloadDocx()">确认下载 Word</button>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
const s2State = {
  a: { items: [], counter: 0, containerId: 's2aItems', emptyId: 's2aEmpty', label: '隐患推送' },
  b: { items: [], counter: 0, containerId: 's2bItems', emptyId: 's2bEmpty', label: '对接协调整治' }
};
let s1Mode = 'data';
let pendingDocxBlob = null;
let pendingFilename = '';

// ============ SECTION 1 TOGGLE ============
function switchS1Mode(mode) {
  s1Mode = mode;
  document.getElementById('s1DataMode').style.display = mode === 'data' ? 'block' : 'none';
  document.getElementById('s1FreeMode').style.display = mode === 'free' ? 'block' : 'none';
  document.getElementById('s1ToggleData').classList.toggle('active', mode === 'data');
  document.getElementById('s1ToggleFree').classList.toggle('active', mode === 'free');
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('reportDate').value = today;
  addS2Item('a');
  addS2Item('b');
});

// ============ SECTION 2 ITEMS (generic for both subsections) ============
function addS2Item(type) {
  const s = s2State[type];
  s.counter++;
  s.items.push({ id: s.counter, content: '', images: [] });
  renderS2Items(type);
}

function removeS2Item(type, id) {
  const s = s2State[type];
  s.items = s.items.filter(i => i.id !== id);
  renderS2Items(type);
}

function handleS2ImageUpload(input, type, itemId) {
  const s = s2State[type];
  const item = s.items.find(i => i.id === itemId);
  if (!item) return;
  const files = Array.from(input.files);
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      item.images.push(e.target.result);
      renderS2Items(type);
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function removeS2Image(type, itemId, imgIdx) {
  const s = s2State[type];
  const item = s.items.find(i => i.id === itemId);
  if (!item) return;
  item.images.splice(imgIdx, 1);
  renderS2Items(type);
}

function renderS2Items(type) {
  const s = s2State[type];
  const container = document.getElementById(s.containerId);
  const emptyEl = document.getElementById(s.emptyId);

  if (s.items.length === 0) {
    container.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  container.innerHTML = s.items.map((item, idx) => `
    <div class="item-card">
      <div class="item-header">
        <span class="item-num">${s.label} #${idx + 1}</span>
        <button class="btn btn-danger btn-sm" onclick="removeS2Item('${type}', ${item.id})">删除</button>
      </div>
      <div class="item-content">
        <div class="form-group">
          <label>工作内容描述</label>
          <textarea rows="4" placeholder="请输入${s.label}的工作内容描述..." onchange="updateS2Content('${type}', ${item.id}, this.value)">${escapeHtml(item.content)}</textarea>
        </div>
        <div class="image-upload-area" onclick="event.stopPropagation(); document.getElementById('s2Img_${type}_${item.id}').click()">
          <div class="upload-icon">📷</div>
          <div class="upload-text">点击上传照片（支持多张）</div>
          <input type="file" id="s2Img_${type}_${item.id}" accept="image/*" multiple style="display:none" onchange="handleS2ImageUpload(this, '${type}', ${item.id})">
        </div>
        ${item.images.length > 0 ? `
          <div class="image-preview-list">
            ${item.images.map((img, i) => `
              <div class="image-preview-item">
                <img src="${img}" alt="照片">
                <button class="remove-btn" onclick="event.stopPropagation();removeS2Image('${type}', ${item.id}, ${i})">&times;</button>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    </div>
  `).join('');
}

function updateS2Content(type, id, val) {
  const s = s2State[type];
  const item = s.items.find(i => i.id === id);
  if (item) item.content = val;
}

// ============ GENERATE REPORT ============
async function generateReport() {
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('statusMsg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 正在生成...';
  status.textContent = '';
  status.className = 'status-msg';

  try {
    const data = collectData();
    const blob = await buildDocx(data);
    pendingDocxBlob = blob;

    const rawDate = data.date || new Date().toISOString().split('T')[0];
    const dateStr = rawDate.replace(/-/g, '');
    const safeTitle = data.mainTitle.replace(/[\\/:*?"<>|]/g, '_');
    pendingFilename = `${safeTitle}${dateStr}.docx`;

    triggerDownload();
    status.textContent = `下载完成！文件名：${pendingFilename}`;
    status.className = 'status-msg success';
  } catch (err) {
    console.error(err);
    status.textContent = '生成失败: ' + err.message;
    status.className = 'status-msg error';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '生成并下载 Word 日报';
  }
}

function collectData() {
  const getVal = id => document.getElementById(id)?.value?.trim() || '';
  const getNum = id => document.getElementById(id)?.value?.trim() || '0';

  const data = {
    date: getVal('reportDate') || new Date().toISOString().split('T')[0],
    mainTitle: getVal('mainTitle') || '成都工务段铁路沿线安全环境隐患排查整治大会战工作日报',
    section1Title: getVal('section1Title') || '一、当日工作开展情况',
    section2Title: getVal('section2Title') || '二、隐患整治推进情况',
    section3Title: getVal('section3Title') || '三、需段协调解决问题',
    s1: {
      personnel: getNum('s1_personnel'),
      ganbu: getNum('s1_ganbu'),
      baobao: getNum('s1_baobao'),
      district: getNum('s1_district'),
      town: getNum('s1_town'),
      village: getNum('s1_village'),
      cancel: getNum('s1_cancel'),
      unresolved: getNum('s1_unresolved'),
      immediate: getNum('s1_immediate'),
      notice: getNum('s1_notice'),
      violation: getNum('s1_violation'),
      extra_note: getVal('s1_extra_note'),
      mode: s1Mode,
      free_text: getVal('s1_free_text'),
    },
    s2a: s2State.a.items.map(item => ({ content: item.content, images: [...item.images] })),
    s2b: s2State.b.items.map(item => ({ content: item.content, images: [...item.images] })),
    s3: getVal('s3_content') || '无',
  };
  return data;
}

// ============ BUILD DOCX ============
async function buildDocx(data) {
  const {
    Document, Packer, Paragraph, TextRun,
    ImageRun, AlignmentType
  } = docx;

  // Image dimensions: 宽4cm × 高3cm at 96 DPI
  // 4cm / 2.54 * 96 = 151px, 3cm / 2.54 * 96 = 113px
  const IMG_W_PX = 151;
  const IMG_H_PX = 113;

  // Parse date
  const d = data.date ? new Date(data.date + 'T00:00:00') : new Date();
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const dateStr = `${d.getFullYear()}年${month}月${day}日`;

  const children = [];

  const LINE_SPACING = 560;
  const FIRST_INDENT = 640;

  // ---- MIXED RUNS HELPER ----
  // Splits text into segments: digits use Times New Roman, rest uses specified font
  function mixedRuns(text, font, size, bold, characterSpacing) {
    const runs = [];
    const parts = text.split(/(\d+(?:\.\d+)?)/);
    for (const part of parts) {
      if (!part) continue;
      if (/^\d+(?:\.\d+)?$/.test(part)) {
        const opts = { text: part, font: 'Times New Roman', size, bold };
        if (characterSpacing !== undefined) opts.characterSpacing = characterSpacing;
        runs.push(new TextRun(opts));
      } else {
        const opts = { text: part, font, size, bold };
        if (characterSpacing !== undefined) opts.characterSpacing = characterSpacing;
        runs.push(new TextRun(opts));
      }
    }
    return runs;
  }

  // ---- TITLE ----
  const titleText = data.mainTitle;
  const splitIdx = titleText.indexOf('大会战');
  const line1 = splitIdx > 0 ? titleText.substring(0, splitIdx) : titleText;
  const line2 = splitIdx > 0 ? titleText.substring(splitIdx) : '';

  children.push(
    new Paragraph({
      alignment: AlignmentType.CENTER,
      spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
      children: mixedRuns(line1, '方正小标宋简体', 44, false, -11)
    })
  );
  if (line2) {
    children.push(
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
        children: mixedRuns(line2, '方正小标宋简体', 44, false, -11)
      })
    );
  }
  children.push(
    new Paragraph({ spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 }, children: [] })
  );

  // Helper: section header (国标黑体)
  function sectionHeader(text) {
    return new Paragraph({
      alignment: AlignmentType.LEFT,
      indent: { firstLine: FIRST_INDENT },
      spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
      children: mixedRuns(text, '国标黑体', 32, false)
    });
  }

  // Helper: subsection header (楷体_GB2312)
  function subsectionHeader(text) {
    return new Paragraph({
      alignment: AlignmentType.LEFT,
      indent: { firstLine: FIRST_INDENT },
      spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
      children: mixedRuns(text, '楷体_GB2312', 32, false)
    });
  }

  // Helper: body paragraph (华文仿宋)
  function bodyParagraph(text, alignment) {
    return new Paragraph({
      alignment: alignment || AlignmentType.BOTH,
      indent: { firstLine: FIRST_INDENT },
      spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
      children: mixedRuns(text, '华文仿宋', 32, false)
    });
  }

  // Helper: add images for an item (2 per row)
  async function addItemImages(images) {
    for (let k = 0; k < images.length; k += 2) {
      try {
        const imgChildren = [];
        const r1 = await resizeImage(images[k], IMG_W_PX, IMG_H_PX);
        imgChildren.push(new ImageRun({
          data: await dataURLToBuffer(r1),
          transformation: { width: IMG_W_PX, height: IMG_H_PX },
          type: 'jpg',
        }));
        if (k + 1 < images.length) {
          imgChildren.push(new TextRun({ text: '  ', font: '华文仿宋', size: 32 }));
          const r2 = await resizeImage(images[k + 1], IMG_W_PX, IMG_H_PX);
          imgChildren.push(new ImageRun({
            data: await dataURLToBuffer(r2),
            transformation: { width: IMG_W_PX, height: IMG_H_PX },
            type: 'jpg',
          }));
        }
        children.push(new Paragraph({
          alignment: AlignmentType.CENTER,
          indent: { firstLine: 0 },
          spacing: { before: 60, after: 60 },
          children: imgChildren,
        }));
      } catch(e) { console.error('图片插入失败:', e.message || e); }
    }
  }

  // ---- SECTION 1 ----
  children.push(sectionHeader(data.section1Title));

  const s1 = data.s1;

  if (s1.mode === 'free' && s1.free_text) {
    children.push(bodyParagraph(s1.free_text));
  } else {
    let s1Text = `${month}月${day}日，我段共出动排查人员${s1.personnel}人次、车间干部${s1.ganbu}人次、包保组成员${s1.baobao}人次；当日对接协调区县${s1.district}个、乡镇（街道）${s1.town}个、村社${s1.village}个。当日隐患销号${s1.cancel}处，未销号隐患${s1.unresolved}处；立查立改隐患${s1.immediate}处，下发隐患告知书${s1.notice}份，违法行为通知书${s1.violation}份。`;

    if (s1.extra_note) {
      s1Text += s1.extra_note;
    }

    children.push(bodyParagraph(s1Text));
  }

  // ---- SECTION 2 ----
  children.push(sectionHeader(data.section2Title));

  // （一）隐患推送情况
  children.push(subsectionHeader('（一）隐患推送情况'));
  const validS2a = data.s2a.filter(item => item.content.trim());
  if (validS2a.length === 0) {
    children.push(bodyParagraph('无'));
  } else {
    for (let i = 0; i < validS2a.length; i++) {
      let content = validS2a[i].content.trim();
      if (content && !content.match(/^\d+\./)) {
        content = `${i + 1}.${content}`;
      }
      children.push(bodyParagraph(content));
      if (validS2a[i].images && validS2a[i].images.length > 0) {
        await addItemImages(validS2a[i].images);
      }
    }
  }

  // （二）对接协调整治情况
  children.push(subsectionHeader('（二）对接协调整治情况'));
  const validS2b = data.s2b.filter(item => item.content.trim());
  if (validS2b.length === 0) {
    children.push(bodyParagraph('无'));
  } else {
    for (let i = 0; i < validS2b.length; i++) {
      let content = validS2b[i].content.trim();
      if (content && !content.match(/^\d+\./)) {
        content = `${i + 1}.${content}`;
      }
      children.push(bodyParagraph(content));
      if (validS2b[i].images && validS2b[i].images.length > 0) {
        await addItemImages(validS2b[i].images);
      }
    }
  }

  // ---- SECTION 3 ----
  children.push(sectionHeader(data.section3Title));
  children.push(bodyParagraph(data.s3));

  // ---- FOOTER ----
  children.push(new Paragraph({ spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 }, children: [] }));
  children.push(new Paragraph({
    alignment: AlignmentType.RIGHT,
    spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
    children: mixedRuns('成都工务段', '华文仿宋', 32, false)
  }));
  children.push(new Paragraph({
    alignment: AlignmentType.RIGHT,
    spacing: { line: LINE_SPACING, lineRule: 'exact', before: 0, after: 0 },
    children: mixedRuns(dateStr, '华文仿宋', 32, false)
  }));

  // Build document
  const doc = new Document({
    sections: [{
      properties: {
        page: {
          margin: {
          top: 1440,
          bottom: 1440,
          left: 1630,
          right: 1630,
          }
        }
      },
      children: children,
    }]
  });

  return await Packer.toBlob(doc);
}

// ============ HELPERS ============
function resizeImage(dataURL, targetW, targetH) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, targetW, targetH);
      ctx.drawImage(img, 0, 0, targetW, targetH);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('Image load failed'));
    img.src = dataURL;
  });
}

function dataURLToBuffer(dataURL) {
  return new Promise((resolve, reject) => {
    try {
      const parts = dataURL.split(',');
      const base64 = parts[1] || parts[0];
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      resolve(bytes);
    } catch(e) { reject(e); }
  });
}

function triggerDownload() {
  if (!pendingDocxBlob) return;
  const url = URL.createObjectURL(pendingDocxBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = pendingFilename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('active');
}

function downloadDocx() {
  triggerDownload();
  closePreview();
}

// ============ GENERATE PDF (Page-by-page rendering) ============
async function generatePDF() {
  const btn = document.getElementById('generatePdfBtn');
  const status = document.getElementById('pdfStatusMsg');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 正在生成PDF...';
  status.textContent = '';
  status.className = 'status-msg';

  try {
    const data = collectData();

    const rawDate = data.date || new Date().toISOString().split('T')[0];
    const d = new Date(rawDate + 'T00:00:00');
    const month = d.getMonth() + 1;
    const day = d.getDate();
    const dateStr = d.getFullYear() + '年' + month + '月' + day + '日';

    const PAGE_W = 794, PAGE_H = 1123;
    const PAD_T = 96, PAD_B = 96, PAD_L = 109, PAD_R = 109;
    const CONTENT_W = PAGE_W - PAD_L - PAD_R;
    const CONTENT_H = PAGE_H - PAD_T - PAD_B;
    const FONT_BODY = 21.3, FONT_TITLE = 29.3, LINE_H = 37.3, INDENT = 42.7;

    function mixedSpans(text, font) {
      const parts = text.split(/(\d+(?:\.\d+)?)/);
      return parts.map(part => {
        if (!part) return '';
        if (/^\d+(?:\.\d+)?$/.test(part)) {
          return '<span style="font-family:\'Times New Roman\',serif;">' + escapeHtml(part) + '</span>';
        }
        return '<span style="font-family:\'' + font + '\';">' + escapeHtml(part) + '</span>';
      }).join('');
    }

    const blocks = [];

    // Title
    const titleText = data.mainTitle;
    const splitIdx = titleText.indexOf('大会战');
    const line1 = splitIdx > 0 ? titleText.substring(0, splitIdx) : titleText;
    const line2 = splitIdx > 0 ? titleText.substring(splitIdx) : '';
    const titleStyle = 'text-align:center; font-size:' + FONT_TITLE + 'px; line-height:' + LINE_H + 'px; letter-spacing:-1px; margin:0; padding:0;';
    blocks.push('<p style="' + titleStyle + '">' + mixedSpans(line1, '方正小标宋简体') + '</p>');
    if (line2) {
      blocks.push('<p style="' + titleStyle + '">' + mixedSpans(line2, '方正小标宋简体') + '</p>');
    }
    blocks.push('<p style="line-height:' + LINE_H + 'px; margin:0; padding:0;">&nbsp;</p>');

    const shStyle = 'font-size:' + FONT_BODY + 'px; line-height:' + LINE_H + 'px; text-indent:' + INDENT + 'px; margin:0; padding:0; text-align:left;';
    const ssStyle = shStyle;
    const bodyStyle = 'font-size:' + FONT_BODY + 'px; line-height:' + LINE_H + 'px; text-indent:' + INDENT + 'px; margin:0; padding:0; text-align:justify; text-align-last:left; word-break:break-word;';

    // Section 1
    blocks.push('<p style="' + shStyle + '">' + mixedSpans(data.section1Title, '国标黑体') + '</p>');
    let s1Text;
    if (data.s1.mode === 'free' && data.s1.free_text) {
      s1Text = data.s1.free_text;
    } else {
      const s1 = data.s1;
      s1Text = month + '月' + day + '日，我段共出动排查人员' + s1.personnel + '人次、车间干部' + s1.ganbu + '人次、包保组成员' + s1.baobao + '人次；当日对接协调区县' + s1.district + '个、乡镇（街道）' + s1.town + '个、村社' + s1.village + '个。当日隐患销号' + s1.cancel + '处，未销号隐患' + s1.unresolved + '处；立查立改隐患' + s1.immediate + '处，下发隐患告知书' + s1.notice + '份，违法行为通知书' + s1.violation + '份。';
      if (s1.extra_note) s1Text += s1.extra_note;
    }
    blocks.push('<p style="' + bodyStyle + '">' + mixedSpans(s1Text, '华文仿宋') + '</p>');

    // Section 2
    blocks.push('<p style="' + shStyle + '">' + mixedSpans(data.section2Title, '国标黑体') + '</p>');
    blocks.push('<p style="' + ssStyle + '">' + mixedSpans('（一）隐患推送情况', '楷体_GB2312') + '</p>');
    const validS2a = data.s2a.filter(item => item.content.trim());
    if (validS2a.length === 0) {
      blocks.push('<p style="' + bodyStyle + '">' + mixedSpans('无', '华文仿宋') + '</p>');
    } else {
      for (let i = 0; i < validS2a.length; i++) {
        let content = validS2a[i].content.trim();
        if (content && !content.match(/^\d+\./)) content = (i + 1) + '.' + content;
        blocks.push('<p style="' + bodyStyle + '">' + mixedSpans(content, '华文仿宋') + '</p>');
        if (validS2a[i].images && validS2a[i].images.length > 0) {
          blocks.push(buildImageHtml(validS2a[i].images));
        }
      }
    }
    blocks.push('<p style="' + ssStyle + '">' + mixedSpans('（二）对接协调整治情况', '楷体_GB2312') + '</p>');
    const validS2b = data.s2b.filter(item => item.content.trim());
    if (validS2b.length === 0) {
      blocks.push('<p style="' + bodyStyle + '">' + mixedSpans('无', '华文仿宋') + '</p>');
    } else {
      for (let i = 0; i < validS2b.length; i++) {
        let content = validS2b[i].content.trim();
        if (content && !content.match(/^\d+\./)) content = (i + 1) + '.' + content;
        blocks.push('<p style="' + bodyStyle + '">' + mixedSpans(content, '华文仿宋') + '</p>');
        if (validS2b[i].images && validS2b[i].images.length > 0) {
          blocks.push(buildImageHtml(validS2b[i].images));
        }
      }
    }

    // Section 3
    blocks.push('<p style="' + shStyle + '">' + mixedSpans(data.section3Title, '国标黑体') + '</p>');
    blocks.push('<p style="' + bodyStyle + '">' + mixedSpans(data.s3, '华文仿宋') + '</p>');

    // Footer
    blocks.push('<p style="line-height:' + LINE_H + 'px; margin:0; padding:0;">&nbsp;</p>');
    blocks.push('<p style="font-size:' + FONT_BODY + 'px; line-height:' + LINE_H + 'px; text-align:right; margin:0; padding:0;">' + mixedSpans('成都工务段', '华文仿宋') + '</p>');
    blocks.push('<p style="font-size:' + FONT_BODY + 'px; line-height:' + LINE_H + 'px; text-align:right; margin:0; padding:0;">' + mixedSpans(dateStr, '华文仿宋') + '</p>');

    // ---- PAGINATION: measure blocks and group into pages ----
    const measureDiv = document.createElement('div');
    measureDiv.style.cssText = 'position:absolute; left:0; top:0; width:' + CONTENT_W + 'px; box-sizing:border-box; background:#ffffff; font-size:' + FONT_BODY + 'px; color:#000; visibility:hidden; z-index:-9999; pointer-events:none;';
    document.body.appendChild(measureDiv);

    const pages = [];
    let currentBlocks = [];
    measureDiv.innerHTML = '';

    try {
      for (const blockHtml of blocks) {
        measureDiv.insertAdjacentHTML('beforeend', blockHtml);
        const totalHeight = measureDiv.offsetHeight;

        if (totalHeight > CONTENT_H && currentBlocks.length > 0) {
          pages.push(currentBlocks);
          currentBlocks = [];
          measureDiv.innerHTML = blockHtml;
        }
        currentBlocks.push(blockHtml);
      }
      if (currentBlocks.length > 0) pages.push(currentBlocks);
    } finally {
      if (measureDiv.parentNode) document.body.removeChild(measureDiv);
    }

    // ---- RENDER: each page independently to canvas ----
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfW = 210, pdfH = 297;
    const isMobile = window.innerWidth < 600;
    const renderScale = isMobile ? 1.5 : 2;
    const jpegQuality = isMobile ? 0.85 : 0.92;

    for (let i = 0; i < pages.length; i++) {
      const pageDiv = document.createElement('div');
      pageDiv.style.cssText = 'position:absolute; left:0; top:0; width:' + PAGE_W + 'px; height:' + PAGE_H + 'px; padding:' + PAD_T + 'px ' + PAD_R + 'px ' + PAD_B + 'px ' + PAD_L + 'px; box-sizing:border-box; background:#ffffff; font-size:' + FONT_BODY + 'px; color:#000; overflow:hidden; z-index:-9999; opacity:0; pointer-events:none;';
      pageDiv.innerHTML = pages[i].join('');
      document.body.appendChild(pageDiv);

      const imgs = pageDiv.querySelectorAll('img');
      await Promise.all(Array.from(imgs).map(img => {
        if (img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
      }));

      const canvas = await html2canvas(pageDiv, {
        scale: renderScale,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        width: PAGE_W,
        height: PAGE_H,
        windowWidth: PAGE_W,
      });

      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', jpegQuality), 'JPEG', 0, 0, pdfW, pdfH);
      document.body.removeChild(pageDiv);
      // Free memory on mobile
      if (isMobile && canvas) {
        canvas.width = 0;
        canvas.height = 0;
      }
    }

    const datePart = rawDate.replace(/-/g, '');
    const safeTitle = data.mainTitle.replace(/[\\/:*?"<>|]/g, '_');
    const filename = safeTitle + datePart + '.pdf';
    pdf.save(filename);

    status.textContent = 'PDF 生成成功！文件名：' + filename;
    status.className = 'status-msg success';
  } catch (err) {
    console.error(err);
    status.textContent = 'PDF 生成失败: ' + err.message;
    status.className = 'status-msg error';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '生成并下载 PDF 日报';
  }
}

// Helper: build image HTML for PDF — 4cm×3cm = 151px×113px, 2 per row
function buildImageHtml(images) {
  const IMG_W = 151;
  const IMG_H = 113;
  let html = '<div style="text-align:center; margin:4px 0; padding:0; font-size:0;">';
  for (let i = 0; i < images.length; i++) {
    html += '<img src="' + images[i] + '" style="width:' + IMG_W + 'px; height:' + IMG_H + 'px; object-fit:cover; margin:2px; border:1px solid #ddd; vertical-align:middle; display:inline-block;" />';
    if (i % 2 === 1 && i < images.length - 1) html += '<br>';
  }
  html += '</div>';
  return html;
}
</script>
